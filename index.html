<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Entry Software</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f4f4f4;padding:20px;}
h1{text-align:center;margin-bottom:20px;color:#222;}
.form-box{background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);margin-bottom:20px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:5px;}
.button-group{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;}
button{background:#007bff;color:white;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;font-weight:bold;}
button:hover{background:#0056b3;}
.search-box{flex:1;}
.table-container{overflow-x:auto;background:white;padding:10px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
table{width:100%;border-collapse:collapse;}
table th{background:#007bff;color:white;padding:10px;border:1px solid #ccc;}
table td{border:1px solid #ccc;padding:8px;text-align:center;}
.filter-input{width:100%;padding:5px;border:none;outline:none;}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

<body>

<h1>Data Entry Software</h1>

<div class="form-box">
<div class="grid">

<input type="date" id="date">
<input type="text" id="description" placeholder="Description">
<input type="number" id="rate" placeholder="Rate">
<input type="number" id="qty" placeholder="Qty">
<input type="number" id="amount" placeholder="Amount">
<input type="text" id="company" placeholder="Company">
<input type="text" id="project" placeholder="Project">
<input type="text" id="partyName" placeholder="Party Name">
<input type="text" id="partyNumber" placeholder="Party Number">
<input type="number" id="givenPayment" placeholder="Given Payment">

<select id="status">
<option value="Clear">Clear</option>
<option value="Pending">Pending</option>
</select>

<input type="text" id="note" placeholder="Note">

</div>

<div class="button-group">
<button onclick="addData()">Save Entry</button>
<input type="text" id="searchInput" class="search-box" placeholder="Search Anything">
<button onclick="searchTable()">Search</button>
</div>
</div>

<div class="table-container">
<table>
<thead>
<tr>
<th>Date</th><th>Description</th><th>Rate</th><th>Qty</th><th>Amount</th>
<th>Company</th><th>Project</th><th>Party Name</th><th>Party Number</th>
<th>Given Payment</th><th>Remaining</th><th>Status</th><th>Note</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script>

// AUTO DATE
window.onload = function(){
    let today = new Date().toISOString().split('T')[0];
    document.getElementById("date").value = today;
}

// 🔥 SAVE DATA (API + TABLE)
async function addData(){

    let data = {
        date: date.value,
        description: description.value,
        rate: rate.value,
        qty: qty.value,
        amount: amount.value || 0,
        company: company.value,
        project: project.value,
        partyName: partyName.value,
        partyNumber: partyNumber.value,
        givenPayment: givenPayment.value || 0,
        status: status.value,
        note: note.value
    };

    data.remainingPayment = data.amount - data.givenPayment;

    // 👉 API CALL
    await fetch("https://data-entry-app-production.up.railway.app/add-user", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    });

    // 👉 TABLE ADD
    document.getElementById("tableBody").innerHTML += `
    <tr>
    <td>${data.date}</td>
    <td>${data.description}</td>
    <td>${data.rate}</td>
    <td>${data.qty}</td>
    <td>${data.amount}</td>
    <td>${data.company}</td>
    <td>${data.project}</td>
    <td>${data.partyName}</td>
    <td>${data.partyNumber}</td>
    <td>${data.givenPayment}</td>
    <td>${data.remainingPayment}</td>
    <td>${data.status}</td>
    <td>${data.note}</td>
    </tr>`;

    clearForm();
    alert("Saved to Database ✅");
}

// CLEAR
function clearForm(){
    document.querySelectorAll(".grid input").forEach(i=>i.value="");
}

// SEARCH
function searchTable(){
    let input = searchInput.value.toLowerCase();
    document.querySelectorAll("#tableBody tr").forEach(row=>{
        row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
    });
}

</script>

</body>
</html>
