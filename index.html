<!DOCTYPE html>
<html>
<head>
  <title>Data Entry App</title>
</head>
<body>

<h2>Data Entry Form</h2>

<input type="date" id="date"><br><br>
<input type="text" id="description" placeholder="Description"><br><br>
<input type="number" id="rate" placeholder="Rate"><br><br>
<input type="number" id="qty" placeholder="Quantity"><br><br>

<input type="text" id="company" placeholder="Company"><br><br>
<input type="text" id="project" placeholder="Project"><br><br>
<input type="text" id="partyName" placeholder="Party Name"><br><br>
<input type="text" id="partyNumber" placeholder="Party Number"><br><br>

<input type="number" id="givenPayment" placeholder="Given Payment"><br><br>

<select id="status">
  <option value="pending">Pending</option>
  <option value="clear">Clear</option>
</select><br><br>

<input type="text" id="note" placeholder="Note"><br><br>

<button onclick="addData()">Add Entry</button>

<h2>Table</h2>

<table border="1">
  <thead>
    <tr>
      <th>Date</th>
      <th>Description</th>
      <th>Rate</th>
      <th>Qty</th>
      <th>Amount</th>
      <th>Company</th>
      <th>Project</th>
      <th>Party Name</th>
      <th>Party Number</th>
      <th>Given Payment</th>
      <th>Status</th>
      <th>Remaining Payment</th>
      <th>Note</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

function addData() {
  let date = document.getElementById("date").value;
  let description = document.getElementById("description").value;
  let rate = document.getElementById("rate").value;
  let qty = document.getElementById("qty").value;

  let amount = rate * qty;

  let company = document.getElementById("company").value;
  let project = document.getElementById("project").value;
  let partyName = document.getElementById("partyName").value;
  let partyNumber = document.getElementById("partyNumber").value;

  let givenPayment = document.getElementById("givenPayment").value;

  let status = document.getElementById("status").value;
  let note = document.getElementById("note").value;

  let remaining = amount - givenPayment;

  let row = `
    <tr>
      <td>${date}</td>
      <td>${description}</td>
      <td>${rate}</td>
      <td>${qty}</td>
      <td>${amount}</td>
      <td>${company}</td>
      <td>${project}</td>
      <td>${partyName}</td>
      <td>${partyNumber}</td>
      <td>${givenPayment}</td>
      <td>${status}</td>
      <td>${remaining}</td>
      <td>${note}</td>
    </tr>
  `;

  document.getElementById("tableBody").innerHTML += row;

  clearForm();
}

function clearForm() {
  document.querySelectorAll("input").forEach(i => i.value = "");
}

</script>

</body>
</html>
